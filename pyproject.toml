[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "armpit"
version = "1.3.3"
description = "Python incremental revision"
readme = "README.md"

[project.scripts]
armpit = "armpit:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
